<!DOCTYPE html>
<html lang="es">
<head>
     <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #bec2ca;
      --bg2: #a0a4b1;
      --accent: #52555e;
      --accent2: #60646b;
      --text: #0a0b0c;
      --text-muted: #52545a;
      --border: rgba(232,228,222,0.08);
      --card: rgba(74, 74, 78, 0.95);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.4rem 5rem;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(10, 10, 10, 0.92); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.5rem;
    z-index: 101;
    }
    .nav-toggle span {
    width: 24px; height: 2px;
    background: var(--text-muted);
    transition: all 0.3s;
    }
    .nav-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.active span:nth-child(2) { opacity: 0; }
    .nav-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .nav-logo { font-family: 'Space Mono', monospace; font-size: 0.85rem; color: var(--accent); letter-spacing: 0.15em; }
    .nav-logo span { color: #696d74;}
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { color: #ebedf1;; text-decoration: none; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; transition: color 0.3s; }
    .nav-links a:hover { color: #7d7f83;}
    section { position: relative; z-index: 1; }

    /* SOBRE MÍ */
    .section-eyebrow { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase; display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.2rem; }
    .section-eyebrow::before { content: ''; width: 18px; height: 1px; background: var(--accent); }
    .section-title { font-family: 'DM Serif Display', serif; font-size: clamp(2.2rem, 4vw, 3.2rem); line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 4rem; }
   
    /* ARTÍCULOS */
    #ciclo_01 { padding: 9rem 5rem; background: var(--bg2); border-top: 1px solid var(--border); }
    .ciclo_01-list { display: flex; flex-direction: column; margin-top: 3rem; border-top: 1px solid var(--bg); }
    .ciclo_01-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 2rem; align-items: center; padding: 2rem 0; border-bottom: 1px solid var(--bg); text-decoration: none; color: var(--text); transition: all 0.3s; }
    .ciclo_01-row:hover { padding-left: 1rem; }
    .ciclo_01-row:hover .art-date { color: var(--accent); }
    .ciclo_01-date { font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(--accent); letter-spacing: 0.08em; transition: color 0.3s; }
    .ciclo_01-info { display: flex; flex-direction: column; gap: 0.5rem; }
    .ciclo_01-title { font-family: 'DM Serif Display', serif; font-size: 1.3rem; letter-spacing: -0.01em; line-height: 1.3; }
    .ciclo_01-desc { font-size: 0.85rem; color: var(#3d3d3f); font-weight: 300; }
    .ciclo_01-tag { font-family: 'Space Mono', monospace; font-size: 0.62rem; color: var(#3d3d3f); letter-spacing: 0.1em; text-transform: uppercase; padding: 0.2rem 0.6rem; border: 1px solid rgba(44, 39, 32, 0.25); width: fit-content; }
    .ciclo_01-arrow { font-size: 1.2rem; color: var(#3d3d3f); transition: all 0.3s; }
    .ciclo_01-row:hover .art-arrow { color: var(#3d3d3f); transform: translateX(4px); }
    .ciclo_01-soon { opacity: 0.35; pointer-events: none; }


    /* CONTACTO */
    #contacto { padding: 4rem 3rem; background: var(--bg); border-top: 1px solid var(--bg); }
    .contact-inner { max-width: 850px; }
    .contact-title em { color: var(#3d3d3f); font-style: italic; }
    .contact-links { display: flex; gap: 2rem; }
    .c-link { display: flex; align-items: center; gap: 0.6rem; padding: 0.8rem 1.6rem; border: 1px solid var(--bg2); color: var(--text-muted); text-decoration: none; font-size: 0.82rem; font-weight: 500; letter-spacing: 0.05em; transition: all 0.3s; }
    .c-link:hover { border-color: var(--accent); color: var(--accent); }
    .c-link svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

    footer { padding: 1.8rem 5rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .footer-txt { font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(#3d3d3f); }
    .footer-txt span { color: var(#3d3d3f); }

    .fade-in { opacity: 0; transform: translateY(18px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .hero-left { animation: fadeUp 0.9s ease forwards; }
    .hero-right { animation: fadeUp 0.9s ease 0.2s both; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); }

    @media (max-width: 960px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links {
        position: fixed;
        top: 0; right: -100%;
        width: 70%; max-width: 300px; height: 100vh;
        background: rgba(10, 10, 10, 0.98);
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 2rem;
        gap: 1.8rem;
        transition: right 0.35s ease;
      }
      .nav-links.active { right: 0; }
      #inicio { grid-template-columns: 1fr; padding: 6rem 1.5rem 4rem; gap: 3rem; }
      .hero-right { align-items: center; }
      .hero-img-wrap, .hero-stats { max-width: 100%; }
      #ciclo_01, #contacto { padding: 5rem 1.5rem; }
      .about-grid { grid-template-columns: 1fr; gap: 3rem; }
      .project-row, .ciclo_01-row { grid-template-columns: 1fr auto; }
      .proj-num, .ciclo_01-date { display: none; }
      footer { padding: 1.5rem; flex-direction: column; gap: 0.5rem; text-align: center; }
      .nav-toggle {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      z-index: 101;
      }
      .nav-toggle span {
      width: 24px; height: 2px;
      background: var(--text-muted);
      transition: all 0.3s;
      }
      .nav-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      .nav-toggle.active span:nth-child(2) { opacity: 0; }
      .nav-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
      }
  </style>
</head>
<body>

<script>
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.08 });
  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    const sections = document.querySelectorAll('section[id]');
    const links = document.querySelectorAll('.nav-links a');
  window.addEventListener('scroll', () => {
    let cur = '';
    sections.forEach(s => { if (window.scrollY >= s.offsetTop - 120) cur = s.id; });
    links.forEach(l => { l.style.color = l.getAttribute('href') === `#${cur}` ? 'var(--accent2)' : ''; });
  });
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
  navToggle.classList.toggle('active');
  navLinks.classList.toggle('active');
  });
  document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', () => {
      navToggle.classList.remove('active');
      navLinks.classList.remove('active');
    });
  });
</script>
